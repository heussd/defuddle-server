services:
  defuddle:
    image: defuddle-server
    ports:
      - "3000:3000"
    environment:
      ALLOW_PRIVATE_NETWORKS: "false"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
